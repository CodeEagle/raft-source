server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://server:3001; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /socket.io/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location = /desktop-manifest.json {
    include /etc/nginx/desktop-manifest-etag.conf;
    etag off;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
}
